    <script>

        const urlParams = new URLSearchParams(window.location.search);
        const keyword = urlParams.get('keyword') || '';
        const rawCategory = urlParams.get('category')|| '';
        const category = rawCategory.replace(/-/g, ' ');

        async function getProductsByKeyword(keyword) {
            const response = await fetch(`http://localhost:8080/api/products/search/${keyword}`, {
                method: 'GET',
                headers: {
                    'Content-Type': 'application/json'
                },
            });
            return response.json();
        }
        async function getProductsByCategory(category) {
            const response = await fetch(`http://localhost:8080/api/products/category/${category}`, {
                method: 'GET',
                headers: {
                    'Content-Type': 'application/json'
                },
            });
            return response.json();
        }
        async function renderSearchResults() {
            const searchResultsContainer = document.getElementById('search-results');
            searchResultsContainer.innerHTML = ''; // Xóa nội dung hiện tại
            let products = [];
            if (keyword) {
                products = await getProductsByKeyword(keyword);
                document.getElementById('keyword-display').innerText = `"${keyword}"`;
                document.getElementById('searchInput').value = keyword;
            }
            else if (category) {
                products = await getProductsByCategory(rawCategory);
                document.getElementById('keyword-display').innerText = `"${category}"`;
            }
            products.forEach(item => {
                const productCard = document.createElement('div');
                productCard.classList.add('product-card');
                productCard.innerHTML = `
                        <img src="${item.prod_img}" alt="${item.prod_name}">
                        <a href="detail_dafix.html?id=${item.prod_id}" class="stretched-link" title="${item.prod_name}"></a>
                        <h3 class="product-name" title="${item.prod_name}">${item.prod_name}</h3>
                        <div class="product-price">${fmtGia(item.prod_price)}</div>
                    `;
                searchResultsContainer.appendChild(productCard);
            });
        }
        function fmtGia(g) {

            var n = parseInt(String(g).replace(/\D/g, ""));

            return isNaN(n)
                ? (g || "")
                : n.toLocaleString("vi-VN");

        }
        async function fetchUserInfo() {
            try {
                const token = localStorage.getItem('token');
                if (!token) {
                    console.error("Token không tồn tại trong localStorage");
                    return null;
                }
                const response = await fetch('http://localhost:8080/api/auth/protected', {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });
                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }
                const userInfo = await response.json();
                document.getElementById('username').textContent = userInfo.user;
            } catch (error) {
                console.error("Lỗi khi gọi API:", error);
                return null; // Trả về null nếu có lỗi
            }
        }
        function checkLogin() {
            const token = localStorage.getItem('token');
            const logoutOptions = document.getElementById('logout-options');
            if (token) {
                fetchUserInfo();
                logoutOptions.innerHTML = '<li><a href="../Dang_nhap.html" id="logout-link">Đăng xuất</a></li>';
                document.getElementById('logout-link').addEventListener('click', function (event) {
                    event.preventDefault();
                    localStorage.removeItem('token');
                    window.location.href = '../Dang_nhap.html';
                });
            } else {
                document.getElementById('username').textContent = 'Guest';
            }
        }
        window.addEventListener('DOMContentLoaded', renderSearchResults);
        window.addEventListener('DOMContentLoaded', checkLogin);
    </script>
