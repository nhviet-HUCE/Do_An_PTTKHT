    <main>
        <div class="search-container">
            <div class="search-header">
                <h2 class="search-title">Kết quả tìm kiếm cho: <span id="keyword-display"
                        style="color: #d32f2f;">"Iphone"</span></h2>
                <div class="sort-options">
                    <label for="sort">Sắp xếp theo:</label>
                    <select id="sort">
                        <option value="newest">Mới nhất</option>
                        <option value="price-asc">Giá: Thấp đến Cao</option>
                        <option value="price-desc">Giá: Cao đến Thấp</option>
                    </select>
                </div>
            </div>

            <div class="product-grid" id="search-results">

                <!-- <div class="product-card">
                    <img src="https://placehold.co/200x200/png?text=Iphone+17+Promax" alt="Iphone 17 promax">

            </div>

            <div class="pagination">
                <a href="#" class="page-item active">1</a>

                <a href="#" class="page-item"><i class="fa-solid fa-chevron-right"></i></a>
            </div>
        </div>
    </main>

    <script>

        const urlParams = new URLSearchParams(window.location.search);
        const keyword = urlParams.get('keyword') || '';
        const rawCategory = urlParams.get('category')|| '';
        const category = rawCategory.replace(/-/g, ' ');

        async function getProductsByKeyword(keyword) {
            const response = await fetch(`http://localhost:8080/api/products/search/${keyword}`, {
                method: 'GET',
                headers: {
                    'Content-Type': 'application/json'
                },
            });
            return response.json();
        }
        async function getProductsByCategory(category) {
            const response = await fetch(`http://localhost:8080/api/products/category/${category}`, {
                method: 'GET',
                headers: {
                    'Content-Type': 'application/json'
                },
            });
            return response.json();
        }
        async function renderSearchResults() {
            const searchResultsContainer = document.getElementById('search-results');
            searchResultsContainer.innerHTML = ''; // Xóa nội dung hiện tại
            let products = [];
            if (keyword) {
                products = await getProductsByKeyword(keyword);
                document.getElementById('keyword-display').innerText = `"${keyword}"`;
                document.getElementById('searchInput').value = keyword;
            }
            else if (category) {
                products = await getProductsByCategory(rawCategory);
                document.getElementById('keyword-display').innerText = `"${category}"`;
            }
            products.forEach(item => {
                const productCard = document.createElement('div');
                productCard.classList.add('product-card');
                productCard.innerHTML = `
                        <img src="${item.prod_img}" alt="${item.prod_name}">
                        <a href="detail.html?id=${item.prod_id}" class="stretched-link" title="${item.prod_name}"></a>
                        <h3 class="product-name" title="${item.prod_name}">${item.prod_name}</h3>
                        <div class="product-price">${fmtGia(item.prod_price)}</div>
                    `;
                searchResultsContainer.appendChild(productCard);
            });
        }
        function fmtGia(g) {

            var n = parseInt(String(g).replace(/\D/g, ""));

            return isNaN(n)
                ? (g || "")
                : n.toLocaleString("vi-VN");

        }
        window.addEventListener('DOMContentLoaded', renderSearchResults);
    </script>

</body>
